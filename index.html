<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard to practice website layout">

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter&family=Roboto&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <title>Dashboard UI</title>
</head>

<body>
    <aside>
        <h1>Dashboard</h1>

        <nav>
            <ul class="main-navigation">
                <!-- use the a element when need to make the website functional -->
                <li class="nav-container">
                    <img class="nav-icon" src="assets/house-icon.svg" alt="House icon">
                    <p class="nav-text home">Home</p>
                </li>

                <li class="nav-container">
                    <img class="nav-icon" src="assets/messages-icon.svg" alt="Messages icon">
                    <p class="nav-text">Messages</p>
                </li>

                <li class="nav-container">
                    <img class="nav-icon" src="assets/tasks-icon.svg" alt="Tasks icon">
                    <p class="nav-text">Tasks</p>
                </li>

                <li class="nav-container">
                    <img class="nav-icon" src="assets/history-icon.svg" alt="History icon">
                    <p class="nav-text">History</p>
                </li>
            </ul>

            <ul class="footer-navigation">
                <li class="nav-container">
                    <img class="nav-icon" src="assets/settings-icon.svg" alt="Settings icon">
                    <p class="nav-text">Settings</p>
                </li>

                <li class="nav-container">
                    <img class="nav-icon" src="assets/log-out-icon.svg" alt="Log out icon">
                    <p class="nav-text">Log out</p>
                </li>
            </ul>
        </nav>
    </aside>

    <header>
        <div class="search-container">
            <button id="search-button" aria-label="Search button">
                <img src="assets/search-icon.svg" alt="Search button" width="24" height="24">
            </button>

            <!-- Label is needed for accessibility with screen readers but we visually hide it -->
            <label for="search-input" class="sr-only">Search</label>
            <input id="search-input" type="text" name="input" placeholder="Search...">
        </div>
        
        <div class="profile-container">
            <img class="notif-icon" src="assets/notif-icon.svg" alt="Notifications icon">
            <img class="alert-icon" src="assets/red-dot.svg" alt="Red dot icon">
            <img class="profile-icon" src="assets/profile-icon.jpg" alt="Profile icon"  width="50" height="50">
        </div>
    </header>
    
    <main>
        <h2>Tasks</h2>

        <!-- Description list more semantic for key/values -->
        <dl>
            <div class="metric-item">
                <!-- Description terms -->
                <dt>New</dt>
                <!-- Description details -->
                <dd>80</dd>
            </div>

            <div class="metric-item">
                <dt>Late</dt>
                <dd>120</dd>
            </div>

            <div class="metric-item">
                <dt>Resolved</dt>
                <dd>75</dd>
            </div>
        </dl>

        <div class="graph-container">
            <div class="graph-information-container">
                <div class="data-container">
                    <p id="total-requests-num">1500</p>
                    <p id="shifting-percentage">+20.65%</p>
                </div>
                
                <p id="graph-title">Overall request treated</p>

                <div class="frequency-container">
                    <p>Monthly</p>
                    <img src="assets/arrow-down-icon.svg" alt="Arrow icon" width="15" height="15">
                </div>
            </div>

            <img class="image" src="assets/requests-graphic.svg" alt="Graphical representation of requests">

            <div class="graph-legend-container">
                <p>Jan.</p>
                <p>March</p>
                <p>May</p>
                <p>July</p>
                <p>Sept.</p>
                <p>Nov.</p>
            </div>
        </div>

        <div class="distribution-container">
            <img class="circle-graph image" src="assets/distribution-graphic.svg" alt="Graph that represents the distribution of tasks">

            <div id="first-contributor" class="contributor-container">
                <p>1.</p>
                <p>Georges Orwell</p>
                <p>+12 requests this week</p>
                <img class="arrow-icon" src="assets/arrow-icon.svg" alt="Arrow icon">
            </div>

            <div id="second-contributor" class="contributor-container">
                <p>2.</p>
                <p>Michel Cruiz</p>
                <p>+26 requests this week</p>
                <img class="arrow-icon" src="assets/arrow-icon.svg" alt="Arrow icon">
            </div>
        </div>
    </main>
</body>
</html>
