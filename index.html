<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard to practice website layout">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter&family=Roboto&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <title>Dashboard</title>
</head>

<body>
    <aside>
        <h1>Dashboard</h1>

        <div class="main-side-bar">
            <div class="nav-container">
                <img class="nav-icon" src="images/Vector.svg" alt="House icon">
                <p class="nav-text home">Home</p>
            </div>
            <div class="nav-container">
                <img class="nav-icon" src="images/Vector (1).svg" alt="Messages icon">
                <p class="nav-text">Messages</p>
            </div>
            <div class="nav-container">
                <img class="nav-icon" src="images/Vector (2).svg" alt="Tasks icon">
                <p class="nav-text">Tasks</p>
            </div>
            <div class="nav-container">
                <img class="nav-icon" src="images/Vector (3).svg" alt="History icon">
                <p class="nav-text">History</p>
            </div>
        </div>

        <div class="footer-side-bar">
            <div class="nav-container">
                <img class="nav-icon" src="images/Vector (4).svg" alt="Settings icon">
                <p class="nav-text">Settings</p>
            </div>
            <div class="nav-container">
                <img class="nav-icon" src="images/Vector (5).svg" alt="Log out icon">
                <p class="nav-text">Log out</p>
            </div>
        </div>
    </aside>

    <header>
        <div class="search-container">
            <button id="search-button">
                <img src="images\search.svg" alt="Search button" width="24px" height="24px">
            </button>
            <input id="search-input" type="text" name="input" placeholder="Search...">
        </div>
        
        <div class="profile-container">
            <img class="notif-icon icon" src="images/Vector (3) (copy 1).svg" alt="Notifications icon">
            <img class="alert-icon icon" src="images/Ellipse 2.svg" alt="Alert icon">
            <img class="profile-icon icon" src="images/ben-sweet-2LowviVHZ-E-unsplash.jpg" alt="Profile icon"  width="50px" height="50px">
        </div>
    </header>
    
    <main>
        <h2>Tasks</h2>

        <div class="metrics-container">
            <div class="metric-item">
                <p class="text-metric">New</p>
                <p class="number-metric">80</p>
            </div>

            <div class="metric-item">
                <p class="text-metric">Late</p>
                <p class="number-metric">120</p>
            </div>

            <div class="metric-item">
                <p class="text-metric">Resolved</p>
                <p class="number-metric">75</p>
            </div>
        </div>

        <div class="graph-container">
            <div class="graph-information-container">
                <div class="data-container">
                    <p id="total-requests-num">1500</p>
                    <p id="shifting-percentage">+20.65%</p>
                </div>
                
                <p id="graph-title">Overall request treated</p>

                <div class="frequency-container">
                    <p>Monthly</p>
                    <img src="images/Vector (2) (copy 1).svg" alt="Arrow icon" width="15px" height="15px">
                </div>
            </div>

            <img class="image" src="images\Frame 1.svg" alt="Graphical representation of requests">

            <div class="graph-legend-container">
                <p>Jan.</p>
                <p>March</p>
                <p>May</p>
                <p>July</p>
                <p>Sept.</p>
                <p>Nov.</p>
            </div>
        </div>

        <div class="distribution-container">
            <img class="circle-graph image" src="images/Component 1.svg" alt="Graph that represents the distribution of tasks">

            <div class="contributor-container">
                <p>1.</p>
                <p>Georges Orwell</p>
                <p>+12 requests this week</p>
                <img class="arrow-icon" src="images/Vector (1) (copy 1).svg" alt="Arrow icon">
            </div>

            <div class="contributor-container">
                <p>2.</p>
                <p>Michel Cruiz</p>
                <p>+26 requests this week</p>
                <img class="arrow-icon" src="images/Vector (1) (copy 1).svg" alt="Arrow icon">
            </div>
        </div>
    </main>
</body>
</html>
